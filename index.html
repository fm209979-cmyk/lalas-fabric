.banner .cd{display:block;position:relative;border-radius:200px 200px 14px 14px;overflow:hidden;background-size:cover;background-position:center;aspect-ratio:3/4;margin-bottom:14px;box-shadow:0 14px 34px #4a0f1a33}
.banner .cd:nth-child(even){border-radius:14px 14px 200px 200px}
.banner .cd b{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:italic 500 16px "Cormorant Garamond",serif;color:#fff;text-shadow:0 1px 8px #000b}
.banner .cd:nth-child(even) b{bottom:auto;top:14px}
.banner .cd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .bdg{position:absolute;right:calc(50% - 64px);bottom:12%;width:128px;height:128px;z-index:3;color:var(--plum);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.s3 .banner{flex-direction:column;align-items:flex-start;justify-content:flex-start;padding-top:26px}.s3 .banner>div{max-width:none;padding:0 20px}.banner .cols{position:relative;width:100%;height:auto;flex:1;min-height:0;margin-top:16px}.banner .col:nth-child(3){display:none}.banner .bdg,.s3 .hint{display:none}.banner h2{font-size:clamp(40px,12vw,64px)}}
.tag{display:block;font:500 12px Jost,sans-serif;letter-spacing:.3em;color:var(--plum);margin-bottom:14px;animation:pup .8s backwards;transition:color .6s}
.lt.lo{animation:letterout .55s ease-in forwards}
@keyframes letterout{to{opacity:0;transform:translateY(-70%) rotateX(70deg)}}
.pin2{animation:pup .8s .45s backwards}.po{opacity:0;transition:opacity .4s}
@keyframes pup{from{opacity:0;transform:translateY(14px)}}
.pbar{display:block;width:130px;height:2px;background:#7b1e2b24;margin:0 0 20px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--plum);animation:fillbar 4.6s linear forwards}
@keyframes fillbar{to{width:100%}}
.banner h2,.banner .cta,.banner .bdg{transition:color .7s,background .7s}
.banner .wipe{position:absolute;inset:0;z-index:5;transform:translateX(-101%);pointer-events:none;background:var(--plum)}
.banner .wipe.go{animation:wipe 1.15s cubic-bezier(.7,0,.3,1)}
@keyframes wipe{0%{transform:translateX(-101%)}45%,55%{transform:none}100%{transform:translateX(101%)}}
.banner .bgw{position:absolute;left:3%;bottom:2%;z-index:0;font:600 clamp(120px,22vw,320px)/.8 "Cormorant Garamond",serif;color:transparent;-webkit-text-stroke:1px var(--plum);opacity:.17;pointer-events:none;white-space:nowrap;animation:bgin 1.4s .5s cubic-bezier(.2,.8,.2,1) backwards}
.banner .bw1{animation-name:bgdn}.banner .bw2{animation-name:bgzoom}.banner .bw3{animation-name:bgr}
@keyframes bgin{from{opacity:0;transform:translateX(-8%)}}@keyframes bgdn{from{opacity:0;transform:translateY(-12%)}}
@keyframes bgzoom{from{opacity:0;transform:scale(1.25)}}@keyframes bgr{from{opacity:0;transform:translateX(8%)}}
.fx1 .lt{animation-name:dropin}.fx2 .lt{animation-name:zoomin}.fx3 .lt:nth-child(odd){animation-name:fromL}.fx3 .lt:nth-child(even){animation-name:fromR}
@keyframes dropin{from{opacity:0;transform:translateY(-120%)}60%{transform:translateY(8%)}}
@keyframes zoomin{from{opacity:0;transform:scale(1.9);filter:blur(10px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-60px)}}@keyframes fromR{from{opacity:0;transform:translateX(60px)}}
@media(max-width:700px){.banner .bgw{font-size:34vw;bottom:auto;top:0}}
.rev{padding:8px 0 56px;overflow:hidden}.rev .sub{color:var(--muted);margin:0 0 24px}
.rtk{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#0000,#000 8%,#000 92%,#0000);mask-image:linear-gradient(90deg,#0000,#000 8%,#000 92%,#0000)}
.rt{display:flex;width:max-content;animation:mq 70s linear infinite}.rtk:hover .rt{animation-play-state:paused}
.rs{display:flex;gap:18px;padding-right:18px}
.rc{margin:0;width:min(340px,80vw);flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 12px 30px #4a0f1a14}
.rc .q{font:600 64px/.6 "Cormorant Garamond",serif;color:var(--plum);opacity:.25;height:30px}
.rc .st{color:#c8962e;letter-spacing:.15em;margin:6px 0 8px}
.rc blockquote{margin:0 0 14px;line-height:1.7;font-size:15px}
.rc figcaption b{display:block;font-weight:500;color:var(--plum)}.rc figcaption span{color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:reduce){.rtk{overflow-x:auto}}
</style>
</head>

const BANK={title:"Account title: Lala's Fabric",bank:"Bank: Meezan Bank",acc:"Account: 0000-0000-0000-00",iban:"IBAN: PK00 MEZN 0000 0000 0000 0000"};
let cart=[],cat="All";
const $=id=>document.getElementById(id),fmt=n=>"Rs "+n.toLocaleString("en-PK");

function chips(){const cs=["All",...new Set(PRODUCTS.map(p=>p.cat))];
 $("chips").innerHTML=cs.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
 $("chips").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;chips();grid()}}}
function grid(){$("grid").innerHTML=PRODUCTS.filter(p=>cat==="All"||p.cat===cat).map(p=>{
 const bg=p.img?`url(${p.img})`:`linear-gradient(165deg,${p.c[0]},${p.c[1]})`;
 return `<article class="p"><div class="ph" style="background-image:${bg}">${p.img?"":p.cat}</div>
 <div class="pb"><h3>${p.name}</h3><div class="pr">${fmt(p.price)}</div>
 <div class="row"><select id="s${p.id}" aria-label="Size"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select>
 <button class="add" data-id="${p.id}">Add to cart</button></div></div></article>`}).join("")}
$("grid").onclick=e=>{const id=+e.target.dataset.id;if(!id)return;
 const p=PRODUCTS.find(x=>x.id===id),size=$("s"+id).value,k=cart.find(i=>i.id===id&&i.size===size);
 k?k.q++:cart.push({id,size,q:1,name:p.name,price:p.price});render();openCart();const cb=$("open");cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump")}

function render(){try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}
 $("cnt").textContent=cart.reduce((a,i)=>a+i.q,0);
 const tot=cart.reduce((a,i)=>a+i.q*i.price,0);
 if(!cart.length){$("body").innerHTML="<p>Your cart is empty. Add a suit to get started.</p>";return}
 $("body").innerHTML=cart.map((i,n)=>`<div class="item"><div>${i.name}<br><small>Size ${i.size} x ${i.q}</small></div><div>${fmt(i.q*i.price)} <button class="x" data-r="${n}" aria-label="Remove">x</button></div></div>`).join("")+
 `<div class="total"><span>Total</span><span>${fmt(tot)}</span></div>
 <label for="nm">Full name</label><input id="nm" autocomplete="name">
 <label for="ph">Phone (03xx xxxxxxx)</label><input id="ph" type="tel" autocomplete="tel">
 <label for="ct">City</label><input id="ct" autocomplete="address-level2">
 <label for="ad">Full address</label><textarea id="ad" rows="2" autocomplete="street-address"></textarea>
 <label>Payment</label>
 <div class="pay"><label><input type="radio" name="pm" value="cod" checked>Cash on delivery</label><label><input type="radio" name="pm" value="bank">Bank transfer</label></div>
 <div class="bank" id="bk" hidden>${Object.values(BANK).join("<br>")}<br>Send the payment screenshot on WhatsApp after placing the order.</div>
 <div class="err" id="err" role="alert"></div>
 <button class="cta" style="width:100%;margin-top:8px" id="place">Place order</button>`;
 document.querySelectorAll("[name=pm]").forEach(r=>r.onchange=()=>$("bk").hidden=r.value!=="bank"||!r.checked)}
$("body").onclick=e=>{if(e.target.dataset.r!==undefined){const n=+e.target.dataset.r;cart.splice(n,1);render()}
 if(e.target.id==="place")place()}
function place(){const v=id=>$(id).value.trim(),ph=v("ph").replace(/[\s-]/g,"");
 if(!v("nm")||!v("ct")||!v("ad"))return $("err").textContent="Please fill in your name, city and address.";
 if(!/^(03\d{9}|\+923\d{9})$/.test(ph))return $("err").textContent="Enter a valid mobile number, for example 03001234567.";
 const pm=document.querySelector("[name=pm]:checked").value,tot=cart.reduce((a,i)=>a+i.q*i.price,0);
 // Hook for the developer: send this order object to your backend, WooCommerce API, Google Sheet or WhatsApp.
 const order={name:v("nm"),phone:ph,city:v("ct"),address:v("ad"),payment:pm,items:cart,total:tot};
 console.log("ORDER",order);
 $("body").innerHTML=`<h2 style="font-size:30px">Thank you, ${order.name}</h2><p>Your order of ${fmt(tot)} is received. We will call you on ${ph} to confirm.${pm==="bank"?"<br><br>Please transfer the amount and send the screenshot on WhatsApp.":""}</p>${MEDIA.whatsapp?`<p><a class="cta" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${waOrder(order)}">Send order on WhatsApp</a></p>`:""}<button class="cta" id="done">Continue shopping</button>`;
 cart=[];try{localStorage.removeItem("cart")}catch(e){}$("cnt").textContent=0;$("done").onclick=()=>$("cart").classList.remove("open")}
function openCart(){$("cart").classList.add("open");render()}
$("open").onclick=openCart;$("close").onclick=()=>$("cart").classList.remove("open");
